spring.application.name=agrodirecto-backend
server.port=${PORT:8080}

# --- Base de datos MySQL (local: docker compose up -d) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/agrodirecto?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:agrodirecto}
spring.datasource.password=${DB_PASSWORD:agrodirecto}

# Flyway es el dueño del esquema; Hibernate no crea ni modifica tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# --- Reglas de negocio configurables ---
agrodirecto.comision-porcentaje=5
agrodirecto.horas-reclamo=24
agrodirecto.horas-liberacion-automatica=48
agrodirecto.alerta-precio-bajo-porcentaje=10
agrodirecto.horas-sesion=12
agrodirecto.cuenta-nueva.pedidos-para-confianza=3
agrodirecto.cuenta-nueva.monto-maximo=1500
agrodirecto.cuenta-nueva.pedidos-abiertos-maximo=2
agrodirecto.secreto-webhook-sms=${SMS_WEBHOOK_SECRET:cambiar-en-produccion}
agrodirecto.origenes-permitidos=http://localhost:3000,https://*.workers.dev
