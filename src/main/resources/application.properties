spring.application.name=agrodirecto-backend
server.port=${PORT:8080}

# --- Base de datos MySQL (local: docker compose up -d) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/agrodirecto?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:agrodirecto}
spring.datasource.password=${DB_PASSWORD:agrodirecto}

# Flyway es el dueño del esquema; Hibernate no crea ni modifica tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Carga colecciones (formatos, zonas) en lotes para evitar una consulta por producto.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# --- Reglas de negocio configurables ---
agrodirecto.comision-porcentaje=5
agrodirecto.horas-reclamo=24
agrodirecto.horas-liberacion-automatica=48
agrodirecto.horas-para-aceptar=24
agrodirecto.minutos-para-pagar=60
agrodirecto.alerta-precio-bajo-porcentaje=10
agrodirecto.cuenta-nueva.pedidos-para-confianza=3
agrodirecto.cuenta-nueva.monto-maximo=1500
agrodirecto.cuenta-nueva.pedidos-abiertos-maximo=2
# --- Seguridad (JWT) ---
agrodirecto.seguridad.jwt-secreto=${JWT_SECRET:clave-de-desarrollo-agrodirecto-cambiar-en-produccion}
agrodirecto.seguridad.horas-token=12
agrodirecto.seguridad.intentos-maximos=5
agrodirecto.seguridad.minutos-bloqueo=15
# Segundo factor (TOTP). La clave cifra los secretos guardados en la base de datos.
agrodirecto.seguridad.clave-cifrado=${TOTP_CLAVE:clave-de-cifrado-de-desarrollo-agrodirecto}
agrodirecto.seguridad.roles-con-doble-factor=ADMINISTRADOR,AGENTE
# Solo para la demostración: activa secretos conocidos en las cuentas demo (ver README). Desactivar en producción.
agrodirecto.seguridad.doble-factor-demo=${DOBLE_FACTOR_DEMO:true}

agrodirecto.secreto-webhook-sms=${SMS_WEBHOOK_SECRET:cambiar-en-produccion}
# Orígenes del frontend (CORS y WebSocket). En producción: ORIGENES_PERMITIDOS=https://tu-frontend.dominio
agrodirecto.origenes-permitidos=${ORIGENES_PERMITIDOS:http://localhost:3000,https://*.workers.dev}

# --- Salud de la aplicación: solo se expone /actuator/health, sin detalles internos ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# --- Documentación de la API (Swagger UI en /swagger-ui.html). Se puede apagar con SWAGGER=false ---
springdoc.api-docs.enabled=${SWAGGER:true}
springdoc.swagger-ui.enabled=${SWAGGER:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
