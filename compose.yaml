# Base de datos local para desarrollo: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: agrodirecto-mysql
    environment:
      MYSQL_DATABASE: agrodirecto
      MYSQL_USER: agrodirecto
      MYSQL_PASSWORD: agrodirecto
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Lima
    ports:
      - "3307:3306"
    volumes:
      - agrodirecto-datos:/var/lib/mysql

volumes:
  agrodirecto-datos:
